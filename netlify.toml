[build]
  command = "npm run netlify:build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# SPA fallback — every unknown path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
